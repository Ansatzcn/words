            width: 100%;

            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e293b;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.9rem;

            background: #f1f5f9;

            border-radius: 40px;

            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: #22c55e;
        }
        .cloud-status .dot.offline {
            background: #ef4444;
        }
        .cloud-status .dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }

        .toolbar {

            margin-bottom: 1.8rem;

            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            margin-bottom: 2.2rem;
            border: 1px solid #e2e8f0;

        }
        .form-group textarea {
            min-height: 60px;
        }
        .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        /* 词性组合下拉：交互结构与 Publish 的书号字段一致 */
        .pos-combo {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .pos-primary-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px;
            gap: 7px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .pos-primary-row input {
            width: 100%;
            min-height: 44px;
            padding: 0.7rem 1rem;
            border: 1px solid #d1d9e6;

            color: #0f172a;

            font-family: inherit;
            font-size: 0.95rem;

            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);

        .pos-history-toggle {

            border-radius: 16px;
            background: white;
            color: #475569;
            font-weight: 700;
            cursor: pointer;

        .pos-history-toggle:hover {

        .pos-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(44px + 7px);
            z-index: 1200;
            max-height: 280px;
            overflow-y: auto;

            background: white;

        .pos-panel.hidden {

        .pos-option-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 6px;
            align-items: stretch;
            width: 100%;
            min-width: 0;

        .pos-option-row + .pos-option-row {
            margin-top: 6px;
        }
        .pos-option {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 0.55rem 0.65rem;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #0f172a;
            text-align: left;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        .pos-option:hover {
            background: #f1f5f9;
        }
        .pos-option.is-current {
            background: #eef2ff;
            color: #1e3a8a;
            font-weight: 650;
        }
        .pos-option-control {
            align-self: stretch;
            min-width: 46px;
            padding: 0.45rem 0.6rem;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            white-space: nowrap;
            cursor: pointer;
        }
        .pos-option-edit {
            background: #dbeafe;
            color: #1e3a8a;
        }
        .pos-option-edit:hover {
            background: #bfdbfe;
        }
        .pos-option-delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .pos-option-delete:hover {
            background: #fecaca;
        }
        .pos-new-hint {
            margin-bottom: 0.5rem;
            padding: 0.48rem 0.6rem;
            border-radius: 10px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.45;

        }
        .pos-empty {

        .btn-primary {
            grid-column: 1 / -1;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.4rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            margin-top: 0.5rem;
        }
        .word-table {
            width: 100%;
            border-collapse: collapse;

        }
        .word-table th {
            background: #f1f5f9;

            padding: 0.9rem 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        .word-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .word-table th.sortable:hover {
            background: #e2e8f0;
        }
        .word-table th.sortable .sort-icon {
            margin-left: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .word-table td {
            padding: 0.58rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            vertical-align: top;
            line-height: 1.34;
        }
        .word-table tbody tr:hover {
            background: #fafcff;
        }
        .word-table tbody tr:last-child td {
            border-bottom: none;
        }
        .word-table .col-word {
            font-weight: 600;
            color: #0f172a;
            white-space: normal;
            min-width: 100px;
        }
        .word-table .word-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            width: 100%;
        }
        .word-table .word-title-text {
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .word-table .word-part-of-speech {
            margin-top: 0.12rem;
            color: #475569;
            font-weight: 500;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .word-table .word-definition {
            margin-top: 0.12rem;
            color: #334155;
            font-weight: 400;
            font-style: italic;
            line-height: 1.32;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .word-table .word-example {
            margin-top: 0.1rem;
            color: #334155;
            font-weight: 400;
            font-style: normal;
            line-height: 1.32;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .word-table .edit-link {
            flex: 0 0 auto;
            margin: 0;
            border: none;
            background: none;
            padding: 0;
            color: #64748b;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 500;
            line-height: 1.5;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
            transition: color 0.15s;
        }
        .word-table .edit-link:hover,
        .word-table .edit-link:focus-visible {
            color: #1e3a8a;
            outline: none;
        }
        .empty-row td {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1rem;
            background: #fafcff;
        }

        .word-list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1.8rem 0 0.8rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .word-list-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0f172a;
        }
        .word-list-header .badge {
            background: #e9edf4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.25s ease;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea,
        .modal-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus,
        .modal-box .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .modal-box .form-group textarea {
            min-height: 56px;
            resize: vertical;
        }
        .modal-box .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 1.2rem;
        }
        .modal-actions .btn-modal {
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        #editModal .modal-actions .btn-modal.delete {
            margin-right: auto;
        }

        .modal-actions .btn-modal.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .modal-actions .btn-modal.delete:hover {
            background: #fecaca;
        }
        .modal-actions .btn-modal.cancel {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-actions .btn-modal.cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-modal.save {
            background: #1e293b;
            color: white;
        }
        .modal-actions .btn-modal.save:hover {
            background: #0f172a;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: #1e293b;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #2563eb;
        }
        .toast.hidden {
            display: none;
        }

        /* 配置弹窗 */
        .config-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            overflow: hidden;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .config-overlay.hidden {
            display: none;
        }
        .config-box {
            background: white;
            border-radius: 28px;
            padding: 0;
            max-width: 560px;
            width: 94%;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s ease;
        }

            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            padding: 2rem 2rem 1rem;
        }
        .config-scroll-body::-webkit-scrollbar {
            width: 10px;
        }
        .config-scroll-body::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 999px;
        }
        .config-scroll-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border: 2px solid #f1f5f9;
            border-radius: 999px;
        }
        .config-scroll-body::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .config-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .config-box .config-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .config-box .form-group {
            margin-bottom: 1rem;
        }
        .config-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .config-box .form-group input,
        .config-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;

        .config-box .form-group select:focus {

            border-color: transparent;
        }

            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
        }
        .config-box .token-profile-btn {
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            background: #f8fafc;
            color: #334155;
            padding: 0.66rem 0.85rem;

            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .config-box .token-profile-btn:hover {

        .config-box .form-group .hint a:hover {

        .config-box .token-save-option {
