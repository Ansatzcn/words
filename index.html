            }

            function applyTokenProfile(profileId) {
                selectedTokenProfileId = profileId || '';
                const profile = tokenProfiles.find(item => item.id === selectedTokenProfileId);
                if (!profile) {
                    cfgSavedToken.value = '';
                    cfgDeleteTokenBtn.disabled = true;
                    return;
                }
                cfgTokenName.value = profile.name;
                cfgToken.value = profile.token;
                cfgOwner.value = profile.owner;
                cfgRepo.value = profile.repo;
                cfgFile.value = profile.file;
                cfgRememberToken.checked = true;
                cfgSavedToken.value = profile.id;
                cfgDeleteTokenBtn.disabled = false;
                configSaveBtn.disabled = false;
            }

            function beginNewToken() {
                selectedTokenProfileId = '';
                cfgSavedToken.value = '';
                cfgTokenName.value = '';
                cfgToken.value = '';
                cfgRememberToken.checked = true;
                cfgDeleteTokenBtn.disabled = true;
                configSaveBtn.disabled = false;
                setTimeout(() => cfgTokenName.focus(), 0);
            }

            function deleteSelectedTokenProfile() {
                const profile = tokenProfiles.find(item => item.id === selectedTokenProfileId);
                if (!profile) return;
                const label = profile.name || [profile.owner, profile.repo].filter(Boolean).join('/') || '该 Token';
                if (!confirm(`确定从本设备删除“${label}”吗？`)) return;

                tokenProfiles = tokenProfiles.filter(item => item.id !== profile.id);
                saveTokenProfiles();
                if (config.activeTokenId === profile.id) {
                    config.activeTokenId = '';
                    config.token = '';
                }
                renderTokenProfileSelect('');
                beginNewToken();
                showToast('已从本设备删除该 Token', 'success');
            }

            function upsertCurrentTokenProfile() {
                const token = cfgToken.value.trim();
                const owner = cfgOwner.value.trim();
                const repo = cfgRepo.value.trim();
                const file = cfgFile.value.trim() || 'wordbook_data.json';
                const name = cfgTokenName.value.trim();
                let profile = tokenProfiles.find(item => item.id === selectedTokenProfileId);

                if (!profile) {
                    profile = tokenProfiles.find(item => item.token === token);
                }

                if (profile) {
                    profile.name = name;
                    profile.token = token;
                    profile.owner = owner;
                    profile.repo = repo;
                    profile.file = file;
                    profile.updatedAt = new Date().toISOString();
                } else {
                    profile = {
                        id: createTokenProfileId(),
                        name,
                        token,
                        owner,
                        repo,
                        file,
                        updatedAt: new Date().toISOString()
                    };
                    tokenProfiles.push(profile);
                }

                selectedTokenProfileId = profile.id;
                saveTokenProfiles();
                renderTokenProfileSelect(profile.id);
                return profile.id;
            }

            function loadConfig() {
                const stored = safeLocalGet(CONFIG_KEY);
                let parsed = {};
                if (stored) {
                    try {
                        parsed = JSON.parse(stored) || {};
                    } catch (error) {
                        console.error('配置解析失败:', error);
                    }
                }

                tokenProfiles = loadTokenProfiles();

                // 将旧版单 Token 自动迁移到多 Token 列表，避免覆盖或丢失。
                const legacyToken = safeLocalGet(TOKEN_LOCAL_KEY) || '';
                if (legacyToken && !tokenProfiles.some(item => item.token === legacyToken)) {
                    tokenProfiles.push({
                        id: createTokenProfileId(),
                        name: '已保存 Token',
                        token: legacyToken,
                        owner: typeof parsed.owner === 'string' ? parsed.owner : '',
                        repo: typeof parsed.repo === 'string' ? parsed.repo : '',
                        file: typeof parsed.file === 'string' && parsed.file.trim() ? parsed.file.trim() : 'wordbook_data.json',
                        updatedAt: new Date().toISOString()
                    });
                    saveTokenProfiles();
                    safeLocalRemove(TOKEN_LOCAL_KEY);
                }

                const requestedId = typeof parsed.activeTokenId === 'string' ? parsed.activeTokenId : '';
                const activeProfile = tokenProfiles.find(item => item.id === requestedId) || tokenProfiles[0] || null;
                const sessionToken = safeSessionGet(TOKEN_SESSION_KEY) || '';
                const rememberToken = typeof parsed.rememberToken === 'boolean'
                    ? parsed.rememberToken
                    : true;

                config = {
                    token: rememberToken && activeProfile ? activeProfile.token : sessionToken,
                    tokenName: rememberToken && activeProfile ? activeProfile.name : '',
                    activeTokenId: rememberToken && activeProfile ? activeProfile.id : '',
                    rememberToken,
                    owner: rememberToken && activeProfile
                        ? activeProfile.owner
                        : (typeof parsed.owner === 'string' ? parsed.owner : ''),
                    repo: rememberToken && activeProfile
                        ? activeProfile.repo
                        : (typeof parsed.repo === 'string' ? parsed.repo : ''),
                    file: rememberToken && activeProfile
                        ? activeProfile.file
                        : (typeof parsed.file === 'string' && parsed.file.trim() ? parsed.file.trim() : 'wordbook_data.json')
                };

                selectedTokenProfileId = config.activeTokenId;
                renderTokenProfileSelect(selectedTokenProfileId);
                cfgTokenName.value = config.tokenName;
                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;
            }

            function saveConfig() {
                config.token = cfgToken.value.trim();
                config.tokenName = cfgTokenName.value.trim();
                config.owner = cfgOwner.value.trim();
                config.repo = cfgRepo.value.trim();
                config.file = cfgFile.value.trim() || 'wordbook_data.json';
                config.rememberToken = cfgRememberToken.checked;

                if (config.rememberToken) {
                    config.activeTokenId = upsertCurrentTokenProfile();
                    safeSessionRemove(TOKEN_SESSION_KEY);
                } else {
                    config.activeTokenId = '';
                    safeSessionSet(TOKEN_SESSION_KEY, config.token);
                }

                safeLocalSet(CONFIG_KEY, JSON.stringify({
                    owner: config.owner,
                    repo: config.repo,
                    file: config.file,
                    rememberToken: config.rememberToken,
                    activeTokenId: config.activeTokenId
                }));
            }

            function isConfigValid() {
                return Boolean(config.token && config.owner && config.repo && config.file);
            }

            // ---------- 同步元数据 ----------
            function createEmptySyncMeta(target = '') {
                return {
                    schemaVersion: SYNC_SCHEMA_VERSION,
                    target,
                    remoteSha: null,
                    lastSyncedFingerprint: null,
                    lastSyncAt: null,
                    baselineWords: null,
                    legacyFingerprintV5: null
                };
            }

            function loadSyncMeta() {
                // v6 保存完整同步基线，用于字段级三方合并。
                const stored = safeLocalGet(SYNC_META_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed && parsed.schemaVersion === SYNC_SCHEMA_VERSION) {
                            syncMeta = {
                                schemaVersion: SYNC_SCHEMA_VERSION,
                                target: typeof parsed.target === 'string' ? parsed.target : '',
                                remoteSha: typeof parsed.remoteSha === 'string' ? parsed.remoteSha : null,
                                lastSyncedFingerprint: typeof parsed.lastSyncedFingerprint === 'string'
                                    ? parsed.lastSyncedFingerprint
                                    : null,
                                lastSyncAt: typeof parsed.lastSyncAt === 'string' ? parsed.lastSyncAt : null,
                                baselineWords: Array.isArray(parsed.baselineWords)
                                    ? normalizeWordList(parsed.baselineWords)
                                    : null,
                                legacyFingerprintV5: typeof parsed.legacyFingerprintV5 === 'string'
                                    ? parsed.legacyFingerprintV5
                                    : null
                            };
                            return;
                        }
                    } catch (error) {
                        console.error('同步元数据 v6 解析失败:', error);
                    }
                }

                // 从 v5 平滑迁移：若当前本地内容仍等于 v5 的最后同步指纹，
                // 当前本地快照即可安全作为三方合并基线。
                const legacyStored = safeLocalGet(LEGACY_SYNC_META_KEY);
                if (legacyStored) {
                    try {
                        const legacy = JSON.parse(legacyStored);
                        const localSnapshot = normalizeWordList(words);
                        const localFingerprintV5 = getLegacyV5Fingerprint(localSnapshot);
                        const canUseLocalAsBaseline = legacy && legacy.schemaVersion === 5 &&
                            typeof legacy.lastSyncedFingerprint === 'string' &&
                            legacy.lastSyncedFingerprint === localFingerprintV5;

                        syncMeta = {
                            schemaVersion: SYNC_SCHEMA_VERSION,
                            target: typeof legacy?.target === 'string' ? legacy.target : '',
                            remoteSha: typeof legacy?.remoteSha === 'string' ? legacy.remoteSha : null,
                            lastSyncedFingerprint: typeof legacy?.lastSyncedFingerprint === 'string'
                                ? legacy.lastSyncedFingerprint
                                : null,
                            lastSyncAt: typeof legacy?.lastSyncAt === 'string' ? legacy.lastSyncAt : null,
                            baselineWords: canUseLocalAsBaseline ? localSnapshot : null,
                            legacyFingerprintV5: typeof legacy?.lastSyncedFingerprint === 'string'
                                ? legacy.lastSyncedFingerprint
                                : null
                        };
                        saveSyncMeta();
                        return;
                    } catch (error) {
                        console.error('同步元数据 v5 迁移失败:', error);
                    }
                }

                syncMeta = createEmptySyncMeta();
            }

            function saveSyncMeta() {
                safeLocalSet(SYNC_META_KEY, JSON.stringify(syncMeta));
                updateLastSyncDisplay();
            }

            function ensureSyncTarget() {
                const target = getSyncTarget();
                if (syncMeta.target !== target) {
                    syncMeta = createEmptySyncMeta(target);
                    saveSyncMeta();
                }
            }

            function recordSynced(snapshot, remoteSha) {
                const normalized = normalizeWordList(snapshot);
                syncMeta = {
                    schemaVersion: SYNC_SCHEMA_VERSION,
                    target: getSyncTarget(),
                    remoteSha: remoteSha || null,
                    lastSyncedFingerprint: getWordsFingerprint(normalized),
                    lastSyncAt: new Date().toISOString(),
                    baselineWords: normalized,
                    legacyFingerprintV5: null
                };
                saveSyncMeta();
            }

            function updateLastSyncDisplay() {
                if (!syncMeta.lastSyncAt || syncMeta.target !== getSyncTarget()) {
                    lastSyncTime.textContent = '未同步';
                    return;
                }
                const date = new Date(syncMeta.lastSyncAt);
                lastSyncTime.textContent = Number.isNaN(date.getTime())
                    ? '已同步'
                    : `已同步 ${date.toLocaleString()}`;
            }

            function hasUnsyncedLocalChanges() {
                if (!isConfigValid()) return false;
                if (syncMeta.target !== getSyncTarget() || syncMeta.lastSyncedFingerprint === null) {
                    return hasStoredLocalData;
                }
                return getWordsFingerprint(words) !== syncMeta.lastSyncedFingerprint;
            }

            // ---------- GitHub API ----------
            async function githubApi(method, endpoint, body = null) {
                const owner = encodeURIComponent(config.owner);
                const repo = encodeURIComponent(config.repo);
                const url = `https://api.github.com/repos/${owner}/${repo}/${endpoint}`;
                const headers = {
                    'Authorization': `Bearer ${config.token}`,
                    'Accept': 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2026-03-10'
                };

                const options = { method, headers };
                if (method === 'GET') {
                    // 浏览器手动刷新或页面自动检查时必须重新向 GitHub 请求最新内容，
                    // 不允许复用浏览器 HTTP 缓存中的旧响应。
                    options.cache = 'no-store';
                }
                if (body !== null) {
                    headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(url, options);
                const raw = await response.text();
                let payload = null;

                if (raw) {
                    try {
                        payload = JSON.parse(raw);
                    } catch (error) {
                        payload = { message: raw };
                    }
                }

                if (!response.ok) {
                    const apiError = new Error(payload?.message || `HTTP ${response.status}`);
                    apiError.status = response.status;
                    apiError.payload = payload;
                    throw apiError;
                }

                return payload;
            }

            function getContentsEndpoint() {
                const path = encodePath(config.file);
                if (!path) throw new Error('数据文件名不能为空');
                return `contents/${path}`;
            }

            async function readRemoteFile() {
                try {
                    const data = await githubApi('GET', getContentsEndpoint());
                    if (!data || data.type !== 'file') {
                        throw new Error('云端路径不是普通文件');
                    }

                    if (Number.isFinite(data.size) && data.size > MAX_SYNC_BYTES) {
                        throw new Error(`云端数据文件为 ${Math.ceil(data.size / 1024)} KB，超过本应用 750 KB 的安全同步上限`);
                    }

                    if (data.encoding !== 'base64' || typeof data.content !== 'string' || !data.sha) {
                        throw new Error('云端文件无法通过 Contents API 安全读取；请确认文件小于 750 KB');
                    }

                    let parsed;
                    try {
                        parsed = JSON.parse(base64ToUtf8(data.content));
                    } catch (error) {
                        throw new Error(`云端数据无法解析：${error.message}`);
                    }

                    if (!Array.isArray(parsed)) {
                        throw new Error('云端 JSON 格式错误：根节点必须是数组');
                    }

                    const normalized = normalizeWordList(parsed);
                    assertSnapshotSyncSize(normalized);
                    return {
                        exists: true,
                        sha: data.sha,
                        size: Number.isFinite(data.size) ? data.size : getSnapshotByteLength(normalized),
                        words: normalized
                    };
                } catch (error) {
                    if (error.status === 404) {
                        return { exists: false, sha: null, size: 0, words: [] };
                    }
                    throw error;
                }
            }

            async function writeRemoteFile(snapshot, sha) {
                const normalized = normalizeWordList(snapshot);
                assertSnapshotSyncSize(normalized);

                const body = {
                    message: `更新单词数据 - ${new Date().toLocaleString()}`,
                    content: utf8ToBase64(serializeSnapshot(normalized))
                };
                if (sha) body.sha = sha;

                const result = await githubApi('PUT', getContentsEndpoint(), body);
                return result?.content?.sha || null;
            }

            // ---------- 冲突备份 ----------
            function loadConflictBackups() {
                const backups = [];
                const stored = safeLocalGet(CONFLICT_BACKUP_KEY);

                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        const list = Array.isArray(parsed) ? parsed : [parsed];
                        for (const item of list) {
                            if (item && Array.isArray(item.words)) {
                                backups.push({
                                    createdAt: typeof item.createdAt === 'string' ? item.createdAt : new Date().toISOString(),
                                    source: typeof item.source === 'string' ? item.source : 'unknown',
                                    target: typeof item.target === 'string' ? item.target : '',
                                    words: normalizeWordList(item.words)
                                });
                            }
                        }
                    } catch (error) {
                        console.error('冲突备份解析失败:', error);
                    }
                }

                return backups
                    .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)))
                    .slice(-MAX_CONFLICT_BACKUPS);
            }

            function saveConflictBackups(backups) {
                safeLocalSet(CONFLICT_BACKUP_KEY, JSON.stringify(backups.slice(-MAX_CONFLICT_BACKUPS)));
            }

            function saveConflictBackup(snapshot, source) {
                const backups = loadConflictBackups();
                backups.push({
                    createdAt: new Date().toISOString(),
                    source,
                    target: getSyncTarget(),
                    words: normalizeWordList(snapshot)
                });
                saveConflictBackups(backups);
            }

            // ---------- 字段级三方合并 ----------
            const MERGE_FIELDS = ['word', 'partOfSpeech', 'original', 'imitation'];

            function cloneWordItem(item) {
                return item ? { ...item } : null;
            }

            function wordItemsEqual(a, b) {
                if (!a || !b) return a === b;
                return a.id === b.id &&
                    a.word === b.word &&
                    a.partOfSpeech === b.partOfSpeech &&
                    a.original === b.original &&
                    a.imitation === b.imitation &&
                    a.addedOrder === b.addedOrder;
            }

            function mapWordsById(list) {
                return new Map(normalizeWordList(list).map(item => [item.id, item]));
            }

            function allocateCollisionWordId(usedIds) {
                let id = createWordId();
                while (usedIds.has(id)) id = createWordId();
                usedIds.add(id);
                return id;
            }

            function mergeExistingWord(baseItem, localItem, remoteItem) {
                const merged = { id: localItem.id };
                for (const field of MERGE_FIELDS) {
                    const baseValue = baseItem[field];
                    const localChanged = localItem[field] !== baseValue;
                    const remoteChanged = remoteItem[field] !== baseValue;

                    // 只有同一条目的同一字段两边都改成不同值时才发生真正字段冲突；
                    // 当前执行同步的平台（local）优先。不同字段的修改会自然同时保留。
                    if (localChanged) {
                        merged[field] = localItem[field];
                    } else if (remoteChanged) {
                        merged[field] = remoteItem[field];
                    } else {
                        merged[field] = baseValue;
                    }
                }

                const localOrderChanged = localItem.addedOrder !== baseItem.addedOrder;
                const remoteOrderChanged = remoteItem.addedOrder !== baseItem.addedOrder;
                merged.addedOrder = localOrderChanged
                    ? localItem.addedOrder
                    : (remoteOrderChanged ? remoteItem.addedOrder : baseItem.addedOrder);
                return merged;
            }

            function resolveAddedOrderCollisions(list, localIds) {
                const items = list.map(item => ({ ...item }));
                let nextOrder = items.reduce((maxOrder, item) => {
                    return Number.isSafeInteger(item.addedOrder) && item.addedOrder > maxOrder
                        ? item.addedOrder
                        : maxOrder;
                }, 0) + 1;

                // 当前操作平台已有的编码优先保留；远端合并进来的碰撞项自动获得新编码。
                const priority = [...items].sort((a, b) => {
                    const aLocal = localIds.has(a.id) ? 0 : 1;
                    const bLocal = localIds.has(b.id) ? 0 : 1;
                    if (aLocal !== bLocal) return aLocal - bLocal;
                    if (a.addedOrder !== b.addedOrder) return a.addedOrder - b.addedOrder;
                    return fingerprintCollator.compare(a.id, b.id);
                });

                const used = new Set();
                const reassigned = new Map();
                for (const item of priority) {
                    let order = item.addedOrder;
                    if (!Number.isSafeInteger(order) || order <= 0 || used.has(order)) {
                        while (used.has(nextOrder)) nextOrder += 1;
                        order = nextOrder;
                        nextOrder += 1;
                    }
                    used.add(order);
                    reassigned.set(item.id, order);
                }

                return items.map(item => ({
                    ...item,
                    addedOrder: reassigned.get(item.id)
                }));
            }

            function threeWayMergeWords(baseSnapshot, localSnapshot, remoteSnapshot) {
                const baseMap = mapWordsById(baseSnapshot || []);
                const localMap = mapWordsById(localSnapshot || []);
                const remoteMap = mapWordsById(remoteSnapshot || []);
                const allIds = new Set([...baseMap.keys(), ...localMap.keys(), ...remoteMap.keys()]);
                const usedIds = new Set(allIds);
                const merged = [];
                let idCollisions = 0;
                let fieldConflicts = 0;

                for (const id of allIds) {
                    const baseItem = baseMap.get(id) || null;
                    const localItem = localMap.get(id) || null;
                    const remoteItem = remoteMap.get(id) || null;

                    if (!baseItem) {
                        // 两端独立新增：ID 不同则分别保留；若极小概率碰巧生成同一 ID，
                        // 当前平台保留原 ID，另一条自动换新 ID，绝不丢失任何新增记录。
                        if (localItem && remoteItem) {
                            if (wordItemsEqual(localItem, remoteItem)) {
                                merged.push(cloneWordItem(localItem));
                            } else {
                                merged.push(cloneWordItem(localItem));
                                const remoteClone = cloneWordItem(remoteItem);
                                remoteClone.id = allocateCollisionWordId(usedIds);
                                merged.push(remoteClone);
                                idCollisions += 1;
                            }
                        } else if (localItem) {
                            merged.push(cloneWordItem(localItem));
                        } else if (remoteItem) {
                            merged.push(cloneWordItem(remoteItem));
                        }
                        continue;
                    }

                    if (!localItem && !remoteItem) {
                        // 两边都删除。
                        continue;
                    }

                    if (!localItem && remoteItem) {
                        // 本地删除、远端未改：删除成立；若远端同时修改，则保留修改后的条目，避免数据丢失。
                        if (!wordItemsEqual(baseItem, remoteItem)) merged.push(cloneWordItem(remoteItem));
                        continue;
                    }

                    if (localItem && !remoteItem) {
                        // 远端删除、本地未改：删除成立；若本地同时修改，则保留当前平台修改后的条目。
                        if (!wordItemsEqual(baseItem, localItem)) merged.push(cloneWordItem(localItem));
                        continue;
                    }

                    for (const field of MERGE_FIELDS) {
                        const localChanged = localItem[field] !== baseItem[field];
                        const remoteChanged = remoteItem[field] !== baseItem[field];
                        if (localChanged && remoteChanged && localItem[field] !== remoteItem[field]) {
                            fieldConflicts += 1;
                        }
                    }
                    merged.push(mergeExistingWord(baseItem, localItem, remoteItem));
                }

                const localIds = new Set(localMap.keys());
                const orderResolved = resolveAddedOrderCollisions(merged, localIds);
                return {
                    words: normalizeWordList(orderResolved),
                    stats: { idCollisions, fieldConflicts }
                };
            }

            function rebaseLiveChanges(attemptLocalSnapshot, liveSnapshot, committedSnapshot) {
                // 同步请求飞行期间如果用户又进行了编辑，把这些新编辑重新应用到刚提交的合并结果之上。
                return threeWayMergeWords(attemptLocalSnapshot, liveSnapshot, committedSnapshot).words;
            }

            function finalizeSuccessfulSync(committedSnapshot, remoteSha, attemptLocalSnapshot, attemptLocalFingerprint, showToastMsg, message) {
                const normalizedCommitted = normalizeWordList(committedSnapshot);
                const liveSnapshot = normalizeWordList(words);
                const liveChangedDuringSync = getWordsFingerprint(liveSnapshot) !== attemptLocalFingerprint;

                recordSynced(normalizedCommitted, remoteSha);

                if (liveChangedDuringSync) {
                    words = rebaseLiveChanges(attemptLocalSnapshot, liveSnapshot, normalizedCommitted);
                    syncQueued = true;
                } else {
                    words = normalizedCommitted;
                }

                applySortAndRender();
                setCloudStatus(syncQueued ? 'offline' : 'online', syncQueued ? '待同步' : '已连接');
                if (syncQueued) lastSyncTime.textContent = '有未同步修改';
                if (showToastMsg && message) showToast(message, 'success');

                return {
                    ok: true,
                    conflict: false,
                    uploadedFingerprint: getWordsFingerprint(normalizedCommitted)
                };
            }

            // ---------- 同步主流程：每次写入前强制读取并三方合并 ----------
            async function performSyncAttempt({ showToastMsg }) {
                ensureSyncTarget();

                const attemptLocalSnapshot = normalizeWordList(words);
                assertSnapshotSyncSize(attemptLocalSnapshot);
                const attemptLocalFingerprint = getWordsFingerprint(attemptLocalSnapshot);
                let baselineSnapshot = Array.isArray(syncMeta.baselineWords)
                    ? normalizeWordList(syncMeta.baselineWords)
                    : null;

                // 这是所有写入的强制前置读取：每一轮（包括 409/422 重试）都重新取得最新内容和 SHA。
                const remote = await readRemoteFile();
                const remoteSnapshot = remote.exists ? remote.words : [];
                const remoteFingerprint = getWordsFingerprint(remoteSnapshot);

                // v5 -> v6 升级时旧版本没有保存完整基线。若旧指纹能证明某一侧仍是上次同步版本，
                // 就用该侧恢复完整基线；只有“两侧在升级前都已修改”的极端情况无法从旧数据反推基线。
                if (!baselineSnapshot && typeof syncMeta.legacyFingerprintV5 === 'string') {
                    const legacyFingerprint = syncMeta.legacyFingerprintV5;
                    if (getLegacyV5Fingerprint(attemptLocalSnapshot) === legacyFingerprint) {
                        baselineSnapshot = attemptLocalSnapshot;
                    } else if (getLegacyV5Fingerprint(remoteSnapshot) === legacyFingerprint) {
                        baselineSnapshot = remoteSnapshot;
                    }
                }
                if (!baselineSnapshot) baselineSnapshot = [];

                const mergedResult = threeWayMergeWords(baselineSnapshot, attemptLocalSnapshot, remoteSnapshot);
                const mergedSnapshot = mergedResult.words;
                const mergedFingerprint = getWordsFingerprint(mergedSnapshot);
                assertSnapshotSyncSize(mergedSnapshot);

                // 最新远端已经等于合并结果时无需写入，只更新本地和同步基线。
                if (remote.exists && mergedFingerprint === remoteFingerprint) {
                    const message = mergedResult.stats.fieldConflicts > 0
                        ? `已自动合并；${mergedResult.stats.fieldConflicts} 个同字段冲突采用当前平台值`
                        : '本地与云端已自动合并并一致';
                    return finalizeSuccessfulSync(
                        mergedSnapshot,
                        remote.sha,
                        attemptLocalSnapshot,
                        attemptLocalFingerprint,
                        showToastMsg,
                        message
                    );
                }

                // 写入必须使用刚刚强制读取到的最新 SHA。远端不存在时不带 SHA 创建文件。
                const newSha = await writeRemoteFile(mergedSnapshot, remote.exists ? remote.sha : null);
                const details = [];
                if (mergedResult.stats.idCollisions > 0) details.push(`${mergedResult.stats.idCollisions} 个重复 ID 已自动重分配`);
                if (mergedResult.stats.fieldConflicts > 0) details.push(`${mergedResult.stats.fieldConflicts} 个同字段冲突采用当前平台值`);
                const message = details.length
                    ? `同步成功：${details.join('；')}`
                    : `成功同步 ${mergedSnapshot.length} 个条目到 GitHub`;

                return finalizeSuccessfulSync(
                    mergedSnapshot,
                    newSha,
                    attemptLocalSnapshot,
                    attemptLocalFingerprint,
                    showToastMsg,
                    message
                );
            }

            async function performSync(options) {
                let lastError = null;
                for (let retry = 0; retry <= MAX_SYNC_RETRIES; retry += 1) {
                    try {
                        return await performSyncAttempt(options);
                    } catch (error) {
                        lastError = error;
                        const isConcurrentWriteConflict = error && (error.status === 409 || error.status === 422);
                        if (!isConcurrentWriteConflict || retry >= MAX_SYNC_RETRIES) throw error;

                        // 409/422 后不沿用旧 SHA/旧合并结果；下一轮从 GitHub 重新读取、重新合并、重新写入。
                        setCloudStatus('syncing', `并发重试 ${retry + 1}/${MAX_SYNC_RETRIES}`);
                    }
                }
                throw lastError || new Error('同步失败');
            }

            async function syncToCloud(showToastMsg = true, interactive = showToastMsg) {
                if (!isConfigValid()) {
                    showToast('请先点击“配置”设置 GitHub 连接', 'error');
                    return false;
                }

                if (isSyncing) {
                    syncQueued = true;
                    return false;
                }

                clearTimeout(autoSyncTimer);
                autoSyncTimer = null;
                isSyncing = true;
                syncBtn.disabled = true;
                setCloudStatus('syncing', '同步中...');

                let result = { ok: false, conflict: false };
                try {
                    result = await performSync({ showToastMsg, interactive });
                } catch (error) {
                    console.error('同步失败:', error);
                    if (error.status === 409 || error.status === 422) {
                        setCloudStatus('offline', '并发同步失败');
                        showToast(`连续 ${MAX_SYNC_RETRIES} 次重试后云端仍在并发变化，本次未覆盖数据；稍后会再次自动同步`, 'error');
                    } else {
                        setCloudStatus('offline', '同步失败');
                        showToast(`同步失败：${formatError(error)}`, 'error');
                    }
                    result = { ok: false, conflict: false };
                } finally {
                    isSyncing = false;
                    syncBtn.disabled = false;
                }

                const currentFingerprint = getWordsFingerprint(words);
                if (result.uploadedFingerprint && currentFingerprint !== result.uploadedFingerprint) {
                    syncQueued = true;
                }

                if (syncQueued) {
                    syncQueued = false;
                    setTimeout(() => syncToCloud(false, false), 0);
                }

                return result.ok;
            }

            // ---------- 跨终端云端刷新 ----------
            async function refreshOpenPageFromCloud(reason = 'timer') {
                if (!isConfigValid()) return { ok: false, skipped: true, changed: false };
                if (document.hidden) return { ok: false, skipped: true, changed: false };
                if (isSyncing) return { ok: false, skipped: true, changed: false };
                if (!editModal.classList.contains('hidden')) return { ok: false, skipped: true, changed: false };

                const now = Date.now();
                if (now - lastCloudRefreshAt < CLOUD_REFRESH_MIN_GAP) {
                    return { ok: false, skipped: true, changed: false };
                }
                lastCloudRefreshAt = now;

                const beforeFingerprint = getWordsFingerprint(words);
                // 有未同步修改时也进入同一个同步入口；该入口会先强制读取 GitHub 最新内容和 SHA，
                // 再执行字段级三方合并，因此不会用旧本地快照直接覆盖云端。
                const ok = await syncToCloud(false, false);
                const changed = ok && getWordsFingerprint(words) !== beforeFingerprint;

                if (changed) {
                    showToast('检测到其他终端的云端更新，当前页面已自动刷新', 'success');
                }
                return { ok, skipped: false, changed };
            }

            function startCloudRefreshLoop() {
                if (cloudRefreshTimer !== null) {
                    clearInterval(cloudRefreshTimer);
                    cloudRefreshTimer = null;
                }
                if (!isConfigValid()) return;

                cloudRefreshTimer = window.setInterval(() => {
                    refreshOpenPageFromCloud('timer');
                }, CLOUD_REFRESH_INTERVAL);
            }

            function triggerImmediateCloudRefresh(reason) {
                if (!isConfigValid() || document.hidden) return;
                refreshOpenPageFromCloud(reason);
            }

            function scheduleAutoSync() {
                if (!isConfigValid()) return;
                clearTimeout(autoSyncTimer);
                autoSyncTimer = setTimeout(() => {
                    autoSyncTimer = null;
                    syncToCloud(false, false);
                }, AUTO_SYNC_DELAY);
            }

            function markLocalChange() {
                if (isConfigValid()) {
                    setCloudStatus('offline', '待同步');
                    lastSyncTime.textContent = '有未同步修改';
                }
                scheduleAutoSync();
            }

            // ---------- 本地存储 ----------
            function loadFromLocal() {
                const stored = safeLocalGet(STORAGE_KEY);
                hasStoredLocalData = stored !== null;

                if (stored) {
                    try {
                        words = normalizeWordList(JSON.parse(stored));
                    } catch (error) {
                        console.error('本地数据解析失败:', error);
                        words = [];
                    }
                } else {
                    // 新仓库/新路径首次打开时从空列表开始，不加载示例词条，也不读取其他页面的旧数据。
                    words = [];
                }

                applySortAndRender();
            }

            function saveToLocal() {
                safeLocalSet(STORAGE_KEY, JSON.stringify(words));
            }

            // ---------- 词性下拉与历史管理 ----------
            function renderPartOfSpeechCombo(which) {
                const isAdd = which === 'add';
                const input = isAdd ? partOfSpeechInput : editPartOfSpeechInput;
                const optionsEl = isAdd ? partOfSpeechOptions : editPartOfSpeechOptions;
                const primary = normalizePartOfSpeechValue(input.value);
                const history = partOfSpeechHistory;
                const isNewValue = Boolean(primary) && !history.some(value => partOfSpeechKey(value) === partOfSpeechKey(primary));

                const newHint = isNewValue
                    ? `<div class="pos-new-option-wrap"><button class="pos-new-option" type="button" data-value="${escapeAttribute(primary)}" title="使用新词性 ${escapeAttribute(primary)}">${escapeHtml(primary)}</button></div>`
                    : '';
                const optionRows = history.length
                    ? history.map((value, index) => `
                        <div class="pos-option-row">
                            <button class="pos-option${partOfSpeechKey(value) === partOfSpeechKey(primary) ? ' is-current' : ''}" type="button" data-value="${escapeAttribute(value)}" title="选择 ${escapeAttribute(value)}">${escapeHtml(value)}</button>
                            <button class="pos-option-control pos-option-move pos-option-up" type="button" data-value="${escapeAttribute(value)}" aria-label="上移词性 ${escapeAttribute(value)}" title="上移" ${index === 0 ? 'disabled' : ''}>↑</button>
                            <button class="pos-option-control pos-option-move pos-option-down" type="button" data-value="${escapeAttribute(value)}" aria-label="下移词性 ${escapeAttribute(value)}" title="下移" ${index === history.length - 1 ? 'disabled' : ''}>↓</button>
                        </div>
                    `).join('')
                    : '<div class="pos-empty">暂无已保存词性</div>';

                optionsEl.innerHTML = newHint + optionRows;
            }

            function setPartOfSpeechPanelOpen(which, open) {
                const panel = which === 'add' ? partOfSpeechPanel : editPartOfSpeechPanel;
                const trigger = which === 'add' ? partOfSpeechTrigger : editPartOfSpeechTrigger;
                panel.classList.toggle('hidden', !open);
                trigger.setAttribute('aria-expanded', String(open));
            }

            function closePartOfSpeechPanels() {
                setPartOfSpeechPanelOpen('add', false);
                setPartOfSpeechPanelOpen('edit', false);
            }

            function choosePartOfSpeech(which, value) {
                const input = which === 'add' ? partOfSpeechInput : editPartOfSpeechInput;
                input.value = normalizePartOfSpeechValue(value);
                setPartOfSpeechPanelOpen(which, false);
                renderPartOfSpeechCombo(which);
                input.focus();
            }

            function movePartOfSpeechHistory(value, direction) {
                const normalized = normalizePartOfSpeechValue(value);
                const index = partOfSpeechHistory.findIndex(item =>
                    partOfSpeechKey(item) === partOfSpeechKey(normalized)
                );
                if (index < 0) return;

                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= partOfSpeechHistory.length) return;

                [partOfSpeechHistory[index], partOfSpeechHistory[targetIndex]] =
                    [partOfSpeechHistory[targetIndex], partOfSpeechHistory[index]];

                savePartOfSpeechHistory();
                applySortAndRender();
            }

            // ---------- 排序与渲染 ----------
            const wordCollator = new Intl.Collator('en', {
                sensitivity: 'base',
                numeric: true
            });

            function sortWords(order) {
                const direction = order || sortOrder;
                const multiplier = direction === 'asc' ? 1 : -1;
                const partOfSpeechRank = new Map(
                    partOfSpeechHistory.map((value, index) => [partOfSpeechKey(value), index])
                );
                const unknownRank = partOfSpeechHistory.length;

                words.sort((a, b) => {
                    const primary = wordCollator.compare(a.word || '', b.word || '');
                    if (primary !== 0) return primary * multiplier;

                    // 同一词汇：始终按词性下拉菜单从上到下，不随单词升/降序反转。
                    const aPartKey = partOfSpeechKey(a.partOfSpeech);
                    const bPartKey = partOfSpeechKey(b.partOfSpeech);
                    const aRank = partOfSpeechRank.has(aPartKey) ? partOfSpeechRank.get(aPartKey) : unknownRank;
                    const bRank = partOfSpeechRank.has(bPartKey) ? partOfSpeechRank.get(bPartKey) : unknownRank;
                    if (aRank !== bRank) return aRank - bRank;

                    // 词性选项相同（或都不在下拉菜单）时，按添加顺序先后。
                    return (a.addedOrder || 0) - (b.addedOrder || 0);
                });
            }

            function applySortAndRender() {
                sortWords(sortOrder);
                renderTable();
                updateSortIcon();
                saveToLocal();
            }

            function renderTable() {
                initializePartOfSpeechHistoryFromWordsIfNeeded();
                renderPartOfSpeechCombo('add');
                renderPartOfSpeechCombo('edit');
                const uniqueWordCount = new Set(words.map(item =>
                    (item.word || '').normalize('NFKC').trim().toLocaleLowerCase('en')
                )).size;
                countDisplay.textContent = `${uniqueWordCount}/${words.length}`;

                if (words.length === 0) {
                    tableBody.innerHTML = '<tr class="empty-row"><td>单词列表为空，添加一个新词吧！</td></tr>';
                    return;
                }

                tableBody.innerHTML = words.map((item, index) => {
                    const word = escapeHtml(item.word);
                    const partOfSpeech = escapeHtml(item.partOfSpeech);
                    const original = escapeHtml(item.original);
                    const imitation = escapeHtml(item.imitation);
                    const partOfSpeechHtml = partOfSpeech
                        ? `<div class="word-part-of-speech">${partOfSpeech}</div>`
                        : '';
                    const originalHtml = original
                        ? `<div class="word-original">${original}</div>`
                        : '';
                    const imitationHtml = imitation
                        ? `<div class="word-imitation">${imitation}</div>`
                        : '';
                    return `
                        <tr data-index="${index}">
                            <td class="col-word">
                                <div class="word-title-row">
                                    <div class="word-title-text">${word}</div>
                                    <button type="button" class="edit-link" data-index="${index}" title="编辑">编辑</button>
                                </div>
                                ${partOfSpeechHtml}
                                ${imitationHtml}
                                ${originalHtml}
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            function updateSortIcon() {
                sortIcon.textContent = sortOrder === 'asc' ? '▲' : '▼';
            }

            // ---------- 编辑功能 ----------
            function openEditModal(index) {
                closePartOfSpeechPanels();
                editingIndex = index;
                const item = words[index];
                editWordInput.value = item.word;
                editPartOfSpeechInput.value = item.partOfSpeech;
                editOriginal.value = item.original;
                editImitation.value = item.imitation;
                renderPartOfSpeechCombo('edit');
                editModal.classList.remove('hidden');
                setTimeout(() => editWordInput.focus(), 100);
            }

            function closeEditModal() {
                setPartOfSpeechPanelOpen('edit', false);
                editModal.classList.add('hidden');
                editingIndex = null;
            }

            function saveEdit() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= words.length) {
                    alert('编辑出错，请重试。');
                    closeEditModal();
                    return;
                }

                const word = editWordInput.value.trim();
                if (!word) {
                    alert('请填写“单词”字段。');
                    editWordInput.focus();
                    return;
                }

                const partOfSpeech = addPartOfSpeechHistory(editPartOfSpeechInput.value);
                words[editingIndex] = {
                    ...words[editingIndex],
                    word,
                    partOfSpeech,
                    original: editOriginal.value.trim(),
                    imitation: editImitation.value.trim()
                };

                closeEditModal();
                applySortAndRender();
                markLocalChange();
            }

            function deleteEditingWord() {
                if (editingIndex === null || editingIndex < 0 || editingIndex >= words.length) {
                    alert('删除出错，请重试。');
                    closeEditModal();
                    return;
                }

                const item = words[editingIndex];
                if (!confirm(`确定要删除“${item.word}”这条词条吗？`)) return;

                words.splice(editingIndex, 1);
                closeEditModal();
                applySortAndRender();
                markLocalChange();
            }

            // ---------- 添加 ----------
            function addWord() {
                const word = wordInput.value.trim();
                if (!word) {
                    alert('请填写“单词”字段。');
                    wordInput.focus();
                    return;
                }

                const partOfSpeech = addPartOfSpeechHistory(partOfSpeechInput.value);
                words.push({
                    id: createWordId(),
                    word,
                    partOfSpeech,
                    original: originalInput.value.trim(),
                    imitation: imitationInput.value.trim(),
                    addedOrder: getNextAddedOrder()
                });

                applySortAndRender();
                markLocalChange();

                wordInput.value = '';
                partOfSpeechInput.value = '';
                originalInput.value = '';
                imitationInput.value = '';
                setPartOfSpeechPanelOpen('add', false);
                renderPartOfSpeechCombo('add');
                wordInput.focus();
            }

            // ---------- 导出/导入 ----------
            function downloadJson(data, filename) {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            }

            function exportData() {
                if (words.length === 0) {
                    alert('单词列表为空，没有什么可导出的。');
                    return;
                }
                downloadJson(words, `wordbook_backup_${new Date().toISOString().slice(0, 10)}.json`);
                showToast('导出成功', 'success');
            }

            function importData(file) {
                if (!file || file.size > MAX_SYNC_BYTES) {
                    alert('文件过大，请选择不超过 750 KB 的 JSON 文件，以确保能够安全同步到 GitHub。');
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (!Array.isArray(imported)) {
                            alert('文件格式错误：根节点必须是数组。');
                            return;
                        }

                        const valid = normalizeWordList(imported);
                        if (valid.length === 0 && imported.length > 0) {
                            alert('文件中没有找到有效的单词数据。');
                            return;
                        }

                        try {
                            assertSnapshotSyncSize(valid);
                        } catch (error) {
                            alert(error.message);
                            return;
                        }

                        if (words.length > 0 && !confirm(`当前有 ${words.length} 个条目，导入将完全替换当前列表。确定继续吗？`)) {
                            return;
                        }

                        words = valid;
                        applySortAndRender();
                        markLocalChange();
                        showToast(`成功导入 ${words.length} 个条目`, 'success');
                    } catch (error) {
                        alert(`解析文件失败：${error.message}`);
                    }
                };
                reader.onerror = function() {
                    alert('读取文件失败。');
                };
                reader.readAsText(file, 'utf-8');
            }

            // ---------- 状态与提示 ----------
            function setCloudStatus(status, text) {
                statusDot.className = `dot ${status}`;
                statusText.textContent = text;
            }

            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = `toast ${type}`;
                toast.classList.remove('hidden');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.add('hidden'), 3500);
            }

            // ---------- 配置弹窗 ----------
            function openConfigModal() {
                renderTokenProfileSelect(config.activeTokenId || selectedTokenProfileId);
                cfgTokenName.value = config.tokenName || '';
                cfgToken.value = config.token;
                cfgRememberToken.checked = config.rememberToken !== false;
                cfgOwner.value = config.owner;
                cfgRepo.value = config.repo;
                cfgFile.value = config.file;
                configSaveBtn.disabled = false;
                configModal.classList.remove('hidden');
                setTimeout(() => cfgToken.focus(), 100);
            }

            function closeConfigModal() {
                configModal.classList.add('hidden');
            }

            function saveConfigAndConnect() {
                configSaveBtn.disabled = false;
                const previousTarget = getSyncTarget();
                const token = cfgToken.value.trim();
                const owner = cfgOwner.value.trim();
                const repo = cfgRepo.value.trim();
                const file = cfgFile.value.trim() || 'wordbook_data.json';

                if (!token) {
                    showToast('请输入 GitHub Token', 'error');
                    cfgToken.focus();
                    return;
                }
                if (!owner) {
                    showToast('请输入仓库所有者', 'error');
                    cfgOwner.focus();
                    return;
                }
                if (!repo) {
                    showToast('请输入仓库名称', 'error');
                    cfgRepo.focus();
                    return;
                }

                config = {
                    ...config,
                    token,
                    tokenName: cfgTokenName.value.trim(),
                    owner,
                    repo,
                    file,
                    rememberToken: cfgRememberToken.checked
                };
                saveConfig();

                if (previousTarget !== getSyncTarget()) {
                    syncMeta = createEmptySyncMeta(getSyncTarget());
                    saveSyncMeta();
                }

                closeConfigModal();
                startCloudRefreshLoop();
                showToast('配置已保存，正在安全同步...', 'info');
                syncToCloud(true, true);
            }

            // ---------- 词性下拉事件 ----------
            partOfSpeechTrigger.addEventListener('click', event => {
                event.stopPropagation();
                const willOpen = partOfSpeechPanel.classList.contains('hidden');
                setPartOfSpeechPanelOpen('edit', false);
                setPartOfSpeechPanelOpen('add', willOpen);
            });
            editPartOfSpeechTrigger.addEventListener('click', event => {
                event.stopPropagation();
                const willOpen = editPartOfSpeechPanel.classList.contains('hidden');
                setPartOfSpeechPanelOpen('add', false);
                setPartOfSpeechPanelOpen('edit', willOpen);
            });
            function handlePartOfSpeechOptionClick(event, which) {
                const upButton = event.target.closest('.pos-option-up[data-value]');
                if (upButton) {
                    event.stopPropagation();
                    movePartOfSpeechHistory(upButton.dataset.value, -1);
                    return;
                }

                const downButton = event.target.closest('.pos-option-down[data-value]');
                if (downButton) {
                    event.stopPropagation();
                    movePartOfSpeechHistory(downButton.dataset.value, 1);
                    return;
                }

                const newOption = event.target.closest('.pos-new-option[data-value]');
                if (newOption) {
                    choosePartOfSpeech(which, newOption.dataset.value);
                    return;
                }

                const option = event.target.closest('.pos-option[data-value]');
                if (option) choosePartOfSpeech(which, option.dataset.value);
            }
            partOfSpeechOptions.addEventListener('click', event => handlePartOfSpeechOptionClick(event, 'add'));
            editPartOfSpeechOptions.addEventListener('click', event => handlePartOfSpeechOptionClick(event, 'edit'));
            partOfSpeechInput.addEventListener('click', event => {
                event.stopPropagation();
                setPartOfSpeechPanelOpen('edit', false);
                setPartOfSpeechPanelOpen('add', true);
            });
            editPartOfSpeechInput.addEventListener('click', event => {
                event.stopPropagation();
                setPartOfSpeechPanelOpen('add', false);
                setPartOfSpeechPanelOpen('edit', true);
            });
            partOfSpeechInput.addEventListener('input', () => {
                renderPartOfSpeechCombo('add');
                setPartOfSpeechPanelOpen('add', true);
            });
            editPartOfSpeechInput.addEventListener('input', () => {
                renderPartOfSpeechCombo('edit');
                setPartOfSpeechPanelOpen('edit', true);
            });
            document.addEventListener('click', event => {
                const addInsidePanel = partOfSpeechPanel.contains(event.target);
                const addOnTrigger = partOfSpeechTrigger.contains(event.target);
                const addOnInput = partOfSpeechInput.contains(event.target);
                const editInsidePanel = editPartOfSpeechPanel.contains(event.target);
                const editOnTrigger = editPartOfSpeechTrigger.contains(event.target);
                const editOnInput = editPartOfSpeechInput.contains(event.target);

                if (!addInsidePanel && !addOnTrigger && !addOnInput) {
                    setPartOfSpeechPanelOpen('add', false);
                }
                if (!editInsidePanel && !editOnTrigger && !editOnInput) {
                    setPartOfSpeechPanelOpen('edit', false);
                }
            });

            // ---------- 表格事件委托 ----------
            tableBody.addEventListener('click', function(event) {
                const editButton = event.target.closest('.edit-link');
                if (!editButton) return;

                const index = Number.parseInt(editButton.dataset.index, 10);
                if (!Number.isInteger(index) || index < 0 || index >= words.length) return;

                openEditModal(index);
            });

            // ---------- 事件绑定 ----------
            addBtn.addEventListener('click', addWord);

            document.querySelectorAll('.add-section input, .add-section textarea').forEach(input => {
                input.addEventListener('keydown', function(event) {
                    if (event.key !== 'Enter') return;
                    if (this.tagName === 'TEXTAREA' && !(event.ctrlKey || event.metaKey)) return;
                    event.preventDefault();
                    addWord();
                });
            });

            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', function() {
                if (this.files?.length) importData(this.files[0]);
                this.value = '';
            });

            sortWordHead.addEventListener('click', function() {
                sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
                applySortAndRender();
            });

            sortWordHead.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    sortWordHead.click();
                }
            });

            syncBtn.addEventListener('click', () => syncToCloud(true, true));

            configBtn.addEventListener('click', openConfigModal);
            configCancelBtn.addEventListener('click', closeConfigModal);
            configSaveBtn.addEventListener('click', saveConfigAndConnect);
            cfgSavedToken.addEventListener('change', () => {
                if (cfgSavedToken.value) {
                    applyTokenProfile(cfgSavedToken.value);
                } else {
                    beginNewToken();
                }
            });
            cfgNewTokenBtn.addEventListener('click', beginNewToken);
            cfgDeleteTokenBtn.addEventListener('click', deleteSelectedTokenProfile);

            [cfgTokenName, cfgToken, cfgOwner, cfgRepo, cfgFile].forEach(input => {
                input.addEventListener('input', () => {
                    configSaveBtn.disabled = false;
                });
            });

            configModal.addEventListener('click', event => {
                if (event.target === configModal) closeConfigModal();
            });

            configModal.querySelectorAll('input[type="text"], input[type="password"]').forEach(input => {
                input.addEventListener('keydown', event => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        saveConfigAndConnect();
                    }
                });
            });

            editDeleteBtn.addEventListener('click', deleteEditingWord);
            editCancelBtn.addEventListener('click', closeEditModal);
            editSaveBtn.addEventListener('click', saveEdit);

            // 仅当一次指针操作确实从遮罩层开始并在遮罩层结束时才关闭弹窗。
            // 这样在 input/textarea 内拖拽选中文字，即使鼠标划出弹窗，也不会误触发关闭。
            let editModalPointerStartedOnOverlay = false;
            let editModalPointerEndedOnOverlay = false;
            editModal.addEventListener('pointerdown', event => {
                editModalPointerStartedOnOverlay = event.target === editModal;
                editModalPointerEndedOnOverlay = false;
            });
            editModal.addEventListener('pointerup', event => {
                editModalPointerEndedOnOverlay = event.target === editModal;
            });
            editModal.addEventListener('pointercancel', () => {
                editModalPointerStartedOnOverlay = false;
                editModalPointerEndedOnOverlay = false;
            });
            editModal.addEventListener('click', event => {
                const shouldClose = editModalPointerStartedOnOverlay
                    && editModalPointerEndedOnOverlay
                    && event.target === editModal;
                editModalPointerStartedOnOverlay = false;
                editModalPointerEndedOnOverlay = false;
                if (shouldClose) closeEditModal();
            });

            editModal.querySelectorAll('input, textarea').forEach(input => {
                input.addEventListener('keydown', function(event) {
                    if (event.key !== 'Enter') return;
                    if (this.tagName === 'TEXTAREA' && !(event.ctrlKey || event.metaKey)) return;
                    event.preventDefault();
                    saveEdit();
                });
            });

            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;
                closePartOfSpeechPanels();
                if (!editModal.classList.contains('hidden')) closeEditModal();
                if (!configModal.classList.contains('hidden')) closeConfigModal();
            });

            function updateBackToTopVisibility() {
                backToTopBtn.classList.toggle('visible', window.scrollY > 240);
            }

            function fastScrollToTop() {
                const startY = window.scrollY;
                if (startY <= 0) return;

                const duration = 10;
                const startTime = performance.now();

                function step(now) {
                    const progress = Math.min((now - startTime) / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    window.scrollTo(0, Math.round(startY * (1 - eased)));

                    if (progress < 1) requestAnimationFrame(step);
                }

                requestAnimationFrame(step);
            }

            backToTopBtn.addEventListener('click', fastScrollToTop);

            // 页面从后台切回、窗口重新获得焦点、网络恢复时，立即检查云端。
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) triggerImmediateCloudRefresh('visibility');
            });
            window.addEventListener('focus', () => triggerImmediateCloudRefresh('focus'));
            window.addEventListener('pageshow', () => triggerImmediateCloudRefresh('pageshow'));
            window.addEventListener('online', () => triggerImmediateCloudRefresh('online'));

            window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
            updateBackToTopVisibility();

            // ---------- 初始化 ----------
            console.info('当前网页独立存储实例：', PAGE_INSTANCE_ID, getPageInstanceIdentity());
            sortWordHead.setAttribute('tabindex', '0');
            sortWordHead.setAttribute('role', 'button');
            toast.setAttribute('role', 'status');
            toast.setAttribute('aria-live', 'polite');

            loadConfig();
            loadPartOfSpeechHistory();
            loadFromLocal();
            loadSyncMeta();
            updateLastSyncDisplay();

            if (isConfigValid()) {
                ensureSyncTarget();
                startCloudRefreshLoop();
                syncToCloud(false, false);
            } else {
                setCloudStatus('offline', '未配置');
            }
        })();
    </script>
</body>
</html>
