<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="app-build" content="2026-09-02-prewrite-three-way-merge-v2">
    <title>Words</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #f5f7fa;
            font-family: "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
            padding: 2rem 1.8rem;
            transition: 0.2s;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1e293b;
            letter-spacing: -0.5px;
            border-bottom: 2px solid #e9edf4;
            padding-bottom: 0.6rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            margin-left: auto;
            background: #f1f5f9;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }
        .cloud-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #475569;
            padding: 0.3rem 1rem;
            background: #f1f5f9;
            border-radius: 40px;
            margin-left: 10px;
        }
        .cloud-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: #22c55e;
        }
        .cloud-status .dot.offline {
            background: #ef4444;
        }
        .cloud-status .dot.syncing {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 1rem;
        }
        .toolbar .left-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .right-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .btn-outline {
            background: transparent;
            border: 1px solid #d1d9e6;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-outline:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .toolbar .btn-outline:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .toolbar .btn-primary-outline {
            background: #1e293b;
            border: 1px solid #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-primary-outline:hover {
            background: #0f172a;
        }
        .toolbar .btn-sync {
            background: #1E40AF;
            border: 1px solid #1E40AF;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .toolbar .btn-sync:hover {
            background: #1E3A8A;
        }
        .toolbar .btn-sync:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .add-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.6rem 1.5rem;
            margin-bottom: 2.2rem;
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .add-section h2 {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .info-tip {
            font-size: 0.8rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            display: inline-block;
            margin-left: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1rem 1.2rem;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #475569;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            transition: 0.2s;
            font-family: inherit;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);
        }
        .form-group textarea {
            min-height: 60px;
        }
        .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        /* 词性组合下拉：交互结构与 Publish 的书号字段一致 */
        .pos-combo {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            font-family: "Times New Roman", serif;
        }

        /* 词性下拉菜单：强制统一使用 Times New Roman，避免按钮/下拉项使用系统 UI 字体 */
        .pos-combo input,
        .pos-combo button,
        .pos-panel,
        .pos-panel * {
            font-family: "Times New Roman", serif !important;
        }
        .pos-primary-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 44px;
            gap: 7px;
            width: 100%;
            max-width: 100%;
            min-width: 0;
        }
        .pos-primary-row input {
            width: 100%;
            min-height: 44px;
            padding: 0.7rem 1rem;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            background: white;
            color: #0f172a;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .pos-primary-row input:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
            box-shadow: 0 0 0 3px rgba(124, 155, 255, 0.2);
        }
        .pos-history-toggle {
            min-height: 44px;
            border: 1px solid #d1d9e6;
            border-radius: 16px;
            background: white;
            color: #475569;
            font-weight: 700;
            cursor: pointer;
        }
        .pos-history-toggle:hover {
            background: #f1f5f9;
        }
        .pos-panel {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(44px + 7px);
            z-index: 1200;
            max-height: 280px;
            overflow-y: auto;
            padding: 0.55rem;
            border: 1px solid #cbd5e1;
            border-radius: 15px;
            background: white;
            box-shadow: 0 15px 30px rgba(15, 23, 42, 0.14);
        }
        .pos-panel.hidden {
            display: none !important;
        }
        .pos-option-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 6px;
            align-items: stretch;
            width: 100%;
            min-width: 0;
        }
        .pos-option-row + .pos-option-row {
            margin-top: 6px;
        }
        .pos-option {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 0.55rem 0.65rem;
            border: 0;
            border-radius: 10px;
            background: white;
            color: #0f172a;
            text-align: left;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        .pos-option:hover {
            background: #f1f5f9;
        }
        .pos-option.is-current {
            background: #eef2ff;
            color: #1E3A8A;
            font-weight: 650;
        }
        .pos-option-control {
            align-self: stretch;
            min-width: 46px;
            padding: 0.45rem 0.6rem;
            border: 0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 650;
            white-space: nowrap;
            cursor: pointer;
        }
        .pos-option-move {
            min-width: 40px;
            background: #f1f5f9;
            color: #475569;
        }
        .pos-option-move:hover:not(:disabled) {
            background: #e2e8f0;
        }
        .pos-option-move:disabled {
            opacity: 0.32;
            cursor: not-allowed;
        }
        .pos-new-option-wrap {
            margin-bottom: 0.5rem;
        }
        .pos-new-option {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            min-height: 34px;
            padding: 0.42rem 0.9rem;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            background: #eff6ff;
            color: #1E40AF;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            line-height: 1.35;
            overflow-wrap: anywhere;
            cursor: pointer;
        }
        .pos-new-option:hover {
            background: #dbeafe;
        }
        .pos-empty {
            padding: 0.6rem;
            color: #94a3b8;
            text-align: center;
            font-size: 0.82rem;
        }

        .btn-primary {
            grid-column: 1 / -1;
            width: 100%;
            max-width: 100%;
            min-width: 0;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.4rem;
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf4;
            margin-top: 0.5rem;
        }
        .word-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.05rem;
        }
        .word-table th {
            background: #f1f5f9;
            text-align: left;
            padding: 0.9rem 1.2rem;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 2px solid #d1d9e6;
            white-space: nowrap;
        }
        .word-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }
        .word-table th.sortable:hover {
            background: #e2e8f0;
        }
        .word-table th.sortable .sort-icon {
            margin-left: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .word-table td {
            padding: 0.58rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            vertical-align: top;
            line-height: 1.34;
        }
        .word-table tbody tr:hover {
            background: #fafcff;
        }
        .word-table tbody tr:last-child td {
            border-bottom: none;
        }
        .word-table .col-word {
            font-weight: 600;
            color: #0f172a;
            white-space: normal;
            min-width: 100px;
        }
        .word-table .word-title-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            width: 100%;
        }
        .word-table .word-title-text {
            min-width: 0;
            overflow-wrap: anywhere;
        }
        .word-table .word-part-of-speech {
            margin-top: 0.12rem;
            color: #475569;
            font-weight: 500;
            line-height: 1.3;
            white-space: normal;
            overflow-wrap: anywhere;
        }
        .word-table .word-original,
        .word-table .word-imitation {
            margin-top: 0.1rem;
            color: #334155;
            font-weight: 400;
            font-style: normal;
            line-height: 1.32;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .word-table .word-imitation {
            font-style: normal;
            color: #1E40AF;
        }
        .word-table .edit-link {
            flex: 0 0 auto;
            margin: 0;
            border: none;
            background: none;
            padding: 0;
            color: #64748b;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            line-height: 1.5;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
            transition: color 0.15s;
        }
        .word-table .edit-link:hover,
        .word-table .edit-link:focus-visible {
            color: #1E3A8A;
            outline: none;
        }
        .empty-row td {
            padding: 2.5rem 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 1.1rem;
            background: #fafcff;
        }

        .word-list-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1.8rem 0 0.8rem 0;
            flex-wrap: wrap;
            gap: 10px;
        }
        .word-list-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
        }
        .word-list-header .badge {
            background: #e9edf4;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #334155;
        }

        /* 编辑弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: white;
            border-radius: 28px;
            padding: 2rem 2rem 1.8rem;
            max-width: 520px;
            width: 92%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.25s ease;
        }
        .modal-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.2rem;
        }
        .modal-box .modal-sub {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .modal-box .form-group {
            margin-bottom: 1rem;
        }
        .modal-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .modal-box .form-group input,
        .modal-box .form-group textarea,
        .modal-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.6rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal-box .form-group input:focus,
        .modal-box .form-group textarea:focus,
        .modal-box .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .modal-box .form-group textarea {
            min-height: 56px;
            resize: vertical;
        }
        .modal-box .form-group select {
            appearance: auto;
            cursor: pointer;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 1.2rem;
        }
        .modal-actions .btn-modal {
            padding: 0.5rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        #editModal .modal-actions .btn-modal.delete {
            margin-right: auto;
        }

        .modal-actions .btn-modal.delete {
            background: #fee2e2;
            color: #991b1b;
        }
        .modal-actions .btn-modal.delete:hover {
            background: #fecaca;
        }
        .modal-actions .btn-modal.cancel {
            background: #f1f5f9;
            color: #334155;
        }
        .modal-actions .btn-modal.cancel:hover {
            background: #e2e8f0;
        }
        .modal-actions .btn-modal.save {
            background: #1e293b;
            color: white;
        }
        .modal-actions .btn-modal.save:hover {
            background: #0f172a;
        }


        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Toast 消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 2rem;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            background: #1e293b;
            max-width: 90%;
            text-align: center;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #dc2626;
        }
        .toast.info {
            background: #1E40AF;
        }
        .toast.hidden {
            display: none;
        }

        /* 配置弹窗 */
        .config-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            overflow: hidden;
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }
        .config-overlay.hidden {
            display: none;
        }
        .config-box {
            background: white;
            border-radius: 28px;
            padding: 0;
            max-width: 560px;
            width: 94%;
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.25s ease;
        }
        .config-scroll-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-gutter: stable;
            padding: 2rem 2rem 1rem;
        }
        .config-scroll-body::-webkit-scrollbar {
            width: 10px;
        }
        .config-scroll-body::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 999px;
        }
        .config-scroll-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border: 2px solid #f1f5f9;
            border-radius: 999px;
        }
        .config-scroll-body::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .config-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .config-box .config-desc {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid #e9edf4;
            padding-bottom: 0.8rem;
        }
        .config-box .form-group {
            margin-bottom: 1rem;
        }
        .config-box .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #475569;
        }
        .config-box .form-group input,
        .config-box .form-group select {
            width: 100%;
            background: white;
            border: 1px solid #d1d9e6;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.2s;
        }
        .config-box .form-group input:focus,
        .config-box .form-group select:focus {
            outline: 2px solid #7c9bff;
            border-color: transparent;
        }
        .config-box .token-profile-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
        }
        .config-box .token-profile-btn {
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            background: #f8fafc;
            color: #334155;
            padding: 0.66rem 0.85rem;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;

    <script>
        (function() {
            // ---------- 页面实例隔离与本地存储 ----------
            // localStorage/sessionStorage 按域名共享，不按 GitHub 仓库路径隔离。
            // 使用当前网页的 origin + pathname 生成稳定命名空间，使不同仓库页面互不读取配置、词条、同步基线和备份。
            function getPageInstanceIdentity() {
                let pathname = window.location.pathname || '/';
                pathname = pathname
                    .replace(/\\/g, '/')
                    .replace(/\/+/g, '/')
                    .replace(/\/(?:index\.html?)$/i, '/');

                if (pathname.length > 1 && pathname.endsWith('/')) {
                    pathname = pathname.slice(0, -1);
                }

                return `${window.location.origin}${pathname}`;
            }

            function hashIdentity(value) {
                // FNV-1a 32 位哈希，仅用于生成存储键名，不用于安全用途。
                let hash = 0x811c9dc5;
                for (let i = 0; i < value.length; i++) {
                    hash ^= value.charCodeAt(i);
                    hash = Math.imul(hash, 0x01000193);
                }
                return (hash >>> 0).toString(16).padStart(8, '0');
            }

            const PAGE_INSTANCE_ID = hashIdentity(getPageInstanceIdentity());
            const STORAGE_NAMESPACE = `english_wordbook:${PAGE_INSTANCE_ID}`;
            const CONFIG_KEY = `${STORAGE_NAMESPACE}:config`;
            const TOKEN_LOCAL_KEY = `${STORAGE_NAMESPACE}:token_local`; // 旧版单 Token 键，仅用于迁移
            const TOKEN_PROFILES_KEY = `${STORAGE_NAMESPACE}:token_profiles_v1`;
            const TOKEN_SESSION_KEY = `${STORAGE_NAMESPACE}:token_session`;
            const STORAGE_KEY = `${STORAGE_NAMESPACE}:words`;
            const PART_OF_SPEECH_HISTORY_KEY = `${STORAGE_NAMESPACE}:part_of_speech_history_v1`;
            const SYNC_SCHEMA_VERSION = 6;
            const SYNC_META_KEY = `${STORAGE_NAMESPACE}:sync_meta_v6`;
            const LEGACY_SYNC_META_KEY = `${STORAGE_NAMESPACE}:sync_meta_v5`;
            const CONFLICT_BACKUP_KEY = `${STORAGE_NAMESPACE}:conflict_backups_v6`;
            const DEVICE_ID_KEY = `${STORAGE_NAMESPACE}:device_id_v1`;
            const MAX_CONFLICT_BACKUPS = 10;
            const MAX_SYNC_BYTES = 750 * 1024;
            const MAX_SYNC_RETRIES = 4;
            const AUTO_SYNC_DELAY = 700;
            // 页面保持打开时也要持续检查云端，避免其他终端更新后本页长期停留在旧版本。
            const CLOUD_REFRESH_INTERVAL = 10 * 1000;
            const CLOUD_REFRESH_MIN_GAP = 1500;

            // ---------- 全局状态 ----------
            let words = [];
            let sortOrder = 'asc';

            let autoSyncTimer = null;

            let config = {

                activeTokenId: '',
                rememberToken: true,
                owner: '',
                repo: '',
                file: 'wordbook_data.json'
            };

            let syncMeta = {

            };

            const partOfSpeechCombo = document.getElementById('partOfSpeechCombo');
            const partOfSpeechInput = document.getElementById('partOfSpeechInput');
            const partOfSpeechTrigger = document.getElementById('partOfSpeechTrigger');
            const partOfSpeechPanel = document.getElementById('partOfSpeechPanel');
            const partOfSpeechOptions = document.getElementById('partOfSpeechOptions');
            const originalInput = document.getElementById('originalInput');
            const imitationInput = document.getElementById('imitationInput');
            const addBtn = document.getElementById('addBtn');
            const tableBody = document.getElementById('tableBody');

            const importBtn = document.getElementById('importBtn');

            // ---------- 通用工具 ----------
            function safeLocalGet(key) {
                try {
                    return localStorage.getItem(key);
                } catch (error) {
                    console.error('读取本地存储失败:', error);
                    return null;
                }
            }

            function safeLocalSet(key, value) {
                try {
                    localStorage.setItem(key, value);
                    return true;
                } catch (error) {
                    console.error('写入本地存储失败:', error);
                    showToast(`本地保存失败：${error.message}`, 'error');
                    return false;
                }
            }

            function safeLocalRemove(key) {
                try {
                    localStorage.removeItem(key);
                    return true;
                } catch (error) {
                    console.error('删除本地存储失败:', error);
                    return false;
                }
            }

            function safeSessionGet(key) {
                try {
                    return sessionStorage.getItem(key);
                } catch (error) {
                    return null;
                }
            }

            function safeSessionSet(key, value) {
                try {
                    sessionStorage.setItem(key, value);
                    return true;
                } catch (error) {
                    showToast(`Token 临时保存失败：${error.message}`, 'error');
                    return false;
                }
            }

            function safeSessionRemove(key) {
                try {
                    sessionStorage.removeItem(key);
                    return true;
                } catch (error) {
                    console.error('删除会话存储失败:', error);
                    return false;
                }
            }

            const partOfSpeechCollator = new Intl.Collator('en', {
                sensitivity: 'base',
                numeric: true
            });

            function normalizePartOfSpeechValue(value) {
                return typeof value === 'string' ? value.normalize('NFKC').trim() : '';
            }

            function partOfSpeechKey(value) {
                return normalizePartOfSpeechValue(value).toLocaleLowerCase('en');
            }

            function uniquePartOfSpeech(values) {
                const seen = new Map();
                for (const raw of values || []) {
                    const value = normalizePartOfSpeechValue(raw);
                    const normalizedKey = partOfSpeechKey(value);
                    if (value && !seen.has(normalizedKey)) seen.set(normalizedKey, value);
                }
                return [...seen.values()];
            }

            function sortPartOfSpeech(values) {
                return uniquePartOfSpeech(values).sort((a, b) => partOfSpeechCollator.compare(a, b));
            }

            function loadPartOfSpeechHistory() {
                const stored = safeLocalGet(PART_OF_SPEECH_HISTORY_KEY);
                partOfSpeechHistoryStored = stored !== null;
                if (!stored) {
                    partOfSpeechHistory = [];
                    return;
                }
                try {
                    const parsed = JSON.parse(stored);
                    partOfSpeechHistory = uniquePartOfSpeech(Array.isArray(parsed) ? parsed : []);
                } catch (error) {
                    console.error('词性历史解析失败:', error);
                    partOfSpeechHistory = [];
                }
            }

            function savePartOfSpeechHistory() {
                partOfSpeechHistory = uniquePartOfSpeech(partOfSpeechHistory);
                safeLocalSet(PART_OF_SPEECH_HISTORY_KEY, JSON.stringify(partOfSpeechHistory));
                partOfSpeechHistoryStored = true;
            }

            function initializePartOfSpeechHistoryFromWordsIfNeeded() {
                if (partOfSpeechHistoryStored) return;
                const derived = sortPartOfSpeech(words.map(item => item.partOfSpeech).filter(Boolean));
                if (!derived.length) return;
                partOfSpeechHistory = derived;
                savePartOfSpeechHistory();
            }

            function addPartOfSpeechHistory(value) {
                const normalized = normalizePartOfSpeechValue(value);
                if (!normalized) return '';
                if (!partOfSpeechHistory.some(item => partOfSpeechKey(item) === partOfSpeechKey(normalized))) {
                    partOfSpeechHistory.push(normalized);
                    savePartOfSpeechHistory();
                }
                return normalized;
            }

            function getDeviceId() {
                if (deviceIdCache) return deviceIdCache;
                const stored = safeLocalGet(DEVICE_ID_KEY);
                if (typeof stored === 'string' && stored.trim()) {
                    deviceIdCache = stored.trim();
                    return deviceIdCache;
                }

                const randomPart = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
                    ? globalThis.crypto.randomUUID().replace(/-/g, '')
                    : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 14)}`;
                deviceIdCache = `d_${randomPart}`;
                safeLocalSet(DEVICE_ID_KEY, deviceIdCache);
                return deviceIdCache;
            }

            function createWordId() {
                const randomPart = (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function')
                    ? globalThis.crypto.randomUUID().replace(/-/g, '')
                    : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 16)}`;
                return `w_${getDeviceId().slice(-12)}_${randomPart}`;
            }

            function normalizeWordId(value) {
                return typeof value === 'string' ? value.normalize('NFKC').trim() : '';
            }

            function normalizeWordItem(item) {
                if (!item || typeof item !== 'object' || typeof item.word !== 'string') {
                    return null;
                }

                const word = item.word.trim();
                if (!word) return null;

                const addedOrder = Number.isSafeInteger(item.addedOrder) && item.addedOrder > 0
                    ? item.addedOrder
                    : null;

                return {
                    id: normalizeWordId(item.id),
                    word,
                    partOfSpeech: normalizePartOfSpeechValue(item.partOfSpeech),
                    original: typeof item.original === 'string'
                        ? item.original.trim()
                        : (typeof item.example === 'string' ? item.example.trim() : ''),
                    imitation: typeof item.imitation === 'string' ? item.imitation.trim() : '',
                    addedOrder
                };
            }

            function normalizeWordList(value) {
                if (!Array.isArray(value)) return [];

                const normalized = value.map(normalizeWordItem).filter(Boolean);
                const usedOrders = new Set();
                let nextOrder = normalized.reduce((maxOrder, item) => {
                    return Number.isSafeInteger(item.addedOrder) && item.addedOrder > maxOrder
                        ? item.addedOrder
                        : maxOrder;
                }, 0) + 1;

                // addedOrder 是用户看到的添加顺序编码。旧数据缺失或同一列表内部重复时，
                // 仅重新分配发生问题的条目，不整体重排已有编码。
                for (const item of normalized) {
                    if (!Number.isSafeInteger(item.addedOrder) || item.addedOrder <= 0 || usedOrders.has(item.addedOrder)) {
                        while (usedOrders.has(nextOrder)) nextOrder += 1;
                        item.addedOrder = nextOrder;
                        nextOrder += 1;
                    }
                    usedOrders.add(item.addedOrder);
                }

                // 旧版本没有稳定 id。以既有 addedOrder 生成确定性的 legacy id，
                // 这样不同终端升级时，同一旧词条仍能被识别为同一条记录。
                const usedIds = new Set();
                for (const item of normalized) {
                    const baseId = item.id || `legacy_${item.addedOrder}`;
                    let candidate = baseId;
                    let suffix = 2;
                    while (usedIds.has(candidate)) {
                        candidate = `${baseId}~${suffix}`;
                        suffix += 1;
                    }
                    item.id = candidate;
                    usedIds.add(candidate);
                }

                return normalized;
            }

            function getNextAddedOrder() {
                return words.reduce((maxOrder, item) => {
                    return Number.isSafeInteger(item.addedOrder) && item.addedOrder > maxOrder
                        ? item.addedOrder
                        : maxOrder;
                }, 0) + 1;
            }

            const fingerprintCollator = new Intl.Collator('en', {
                sensitivity: 'variant',
                numeric: true
            });

            function getWordsFingerprint(list) {
                const canonical = normalizeWordList(list)
                    .map(item => ({
                        id: item.id,
                        word: item.word,
                        partOfSpeech: item.partOfSpeech,
                        original: item.original,
                        imitation: item.imitation,
                        addedOrder: item.addedOrder
                    }))
                    .sort((a, b) => {
                        const idCompared = fingerprintCollator.compare(a.id, b.id);
                        if (idCompared !== 0) return idCompared;
                        const fields = ['word', 'partOfSpeech', 'original', 'imitation'];
                        for (const field of fields) {
                            const compared = fingerprintCollator.compare(a[field], b[field]);
                            if (compared !== 0) return compared;
                        }
                        return a.addedOrder - b.addedOrder;
                    });
                return JSON.stringify(canonical);
            }

            function getLegacyV5Fingerprint(list) {
                const canonical = normalizeWordList(list)
                    .map(item => ({
                        word: item.word,
                        partOfSpeech: item.partOfSpeech,
                        original: item.original,
                        imitation: item.imitation,
                        addedOrder: item.addedOrder
                    }))
                    .sort((a, b) => {
                        const fields = ['word', 'partOfSpeech', 'original', 'imitation'];
                        for (const field of fields) {
                            const compared = fingerprintCollator.compare(a[field], b[field]);
                            if (compared !== 0) return compared;
                        }
                        return a.addedOrder - b.addedOrder;
                    });
                return JSON.stringify(canonical);
            }

            function serializeSnapshot(snapshot) {
                return JSON.stringify(normalizeWordList(snapshot), null, 2);
            }

            function getSnapshotByteLength(snapshot) {
                return new TextEncoder().encode(serializeSnapshot(snapshot)).length;
            }

            function assertSnapshotSyncSize(snapshot) {
                const byteLength = getSnapshotByteLength(snapshot);
                if (byteLength > MAX_SYNC_BYTES) {
                    const sizeKb = Math.ceil(byteLength / 1024);
                    throw new Error(`数据文件约 ${sizeKb} KB，超过安全同步上限 750 KB；请导出并拆分数据后再同步`);
                }
            }

            function utf8ToBase64(text) {
                const bytes = new TextEncoder().encode(text);
                let binary = '';
                const chunkSize = 0x8000;
                for (let offset = 0; offset < bytes.length; offset += chunkSize) {
                    const chunk = bytes.subarray(offset, offset + chunkSize);
                    binary += String.fromCharCode(...chunk);
                }
                return btoa(binary);
            }

            function base64ToUtf8(base64) {
                const clean = String(base64 || '').replace(/\s/g, '');
                const binary = atob(clean);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = String(text);
                return div.innerHTML;
            }

            function escapeAttribute(text) {
                return escapeHtml(text).replace(/"/g, '&quot;');
            }

            function getSyncTarget() {
                if (!config.owner || !config.repo || !config.file) return '';
                return `${config.owner}/${config.repo}/${config.file}`;
            }

            function encodePath(path) {
                return String(path)
                    .split('/')
                    .filter(segment => segment.length > 0)
                    .map(encodeURIComponent)
                    .join('/');
            }

            function formatError(error) {
                if (!error) return '未知错误';
                if (error.status === 401) return 'Token 无效或已过期';
                if (error.status === 403) return 'Token 权限不足、仓库访问被拒绝或触发了 API 限制';
                if (error.status === 404) return '仓库、分支或文件路径不存在，或 Token 无权访问';
                if (error.status === 409) return '云端文件已被其他设备修改';
                if (error.status === 422) return `请求校验失败：${error.message}`;
                return error.message || String(error);
            }


            // ---------- 配置管理 ----------
            function createTokenProfileId() {
                if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                    return window.crypto.randomUUID();
                }
                return `token_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
            }

            function normalizeTokenProfile(item) {
                if (!item || typeof item !== 'object') return null;
                const token = typeof item.token === 'string' ? item.token.trim() : '';
                if (!token) return null;
                return {
                    id: typeof item.id === 'string' && item.id ? item.id : createTokenProfileId(),
                    name: typeof item.name === 'string' ? item.name.trim() : '',
                    token,
                    owner: typeof item.owner === 'string' ? item.owner.trim() : '',
                    repo: typeof item.repo === 'string' ? item.repo.trim() : '',
                    file: typeof item.file === 'string' && item.file.trim() ? item.file.trim() : 'wordbook_data.json',
                    updatedAt: typeof item.updatedAt === 'string' ? item.updatedAt : new Date().toISOString()
                };
            }

            function loadTokenProfiles() {
                const stored = safeLocalGet(TOKEN_PROFILES_KEY);
                if (!stored) return [];
                try {
                    const parsed = JSON.parse(stored);
                    if (!Array.isArray(parsed)) return [];
                    return parsed.map(normalizeTokenProfile).filter(Boolean);
                } catch (error) {
                    console.error('Token 列表解析失败:', error);
                    return [];
                }
            }

            function saveTokenProfiles() {
                safeLocalSet(TOKEN_PROFILES_KEY, JSON.stringify(tokenProfiles));
            }

            function getTokenProfileLabel(profile, index) {
                const suffix = profile.token.length > 4 ? profile.token.slice(-4) : profile.token;
                const target = [profile.owner, profile.repo].filter(Boolean).join('/');
                return profile.name || target || `Token ${index + 1} ····${suffix}`;
            }

            function renderTokenProfileSelect(preferredId = selectedTokenProfileId) {
                const options = ['<option value="">新增 Token</option>'];
                tokenProfiles.forEach((profile, index) => {
                    const option = document.createElement('option');
                    option.value = profile.id;
                    option.textContent = getTokenProfileLabel(profile, index);
                    options.push(option.outerHTML);
                });

                cfgSavedToken.value = selectedTokenProfileId;
